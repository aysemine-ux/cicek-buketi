
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renkli Çiçek Buketi 💐</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #05030a;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
#mesaj {
  position: fixed;
  bottom: 8%;
  width: 100%;
  text-align: center;
  color: #fff0f5;
  font-family: Georgia, serif;
  font-size: clamp(18px, 4vw, 30px);
  letter-spacing: 3px;
  opacity: 0;
  transition: opacity 2s;
  pointer-events: none;
  text-shadow: 0 0 15px #ff8ac5;
}
#mesaj.goster { opacity: 1; }
</style>
</head>
<body>

<canvas id="sahne"></canvas>
<div id="mesaj"></div>

<script>
const canvas = document.getElementById("sahne");
const ctx = canvas.getContext("2d");
const mesaj = document.getElementById("mesaj");

const params = new URLSearchParams(location.search);
mesaj.textContent = (params.get("text") || "").slice(0, 80);

let W, H, DPR, baslangic = 0;
let sonZaman = 0;
let parcaciklar = [];

const cicekler = [
  { x:-0.29, y:-0.08, r:0.105, renk:"#ff75b9", merkez:"#ffe49a", n:13 },
  { x: 0.29, y:-0.12, r:0.095, renk:"#ffad45", merkez:"#793b16", n:12 },
  { x:-0.16, y:-0.28, r:0.105, renk:"#a77aff", merkez:"#ffdb83", n:14 },
  { x: 0.16, y:-0.30, r:0.105, renk:"#ff527b", merkez:"#ffe8a1", n:13 },
  { x: 0,    y:-0.43, r:0.125, renk:"#fff0a0", merkez:"#ec9b37", n:15 },
  { x:-0.39, y:-0.38, r:0.075, renk:"#ffffff", merkez:"#ffd15a", n:11 },
  { x: 0.40, y:-0.40, r:0.075, renk:"#ff9acb", merkez:"#fff0a0", n:11 }
];

const paletler = [
  "#ff75b9", "#a77aff", "#ffad45",
  "#ff527b", "#fff0a0", "#ffffff",
  "#ff9acb"
];

function rastgele(a,b) {
  return a + Math.random() * (b-a);
}

function boyutla() {
  W = window.innerWidth;
  H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize", boyutla);

function yumusak(t) {
  t = Math.max(0,Math.min(1,t));
  return t*t*(3-2*t);
}

function cizgi(x1,y1,x2,y2,renk,kalinlik) {
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.strokeStyle = renk;
  ctx.lineWidth = kalinlik;
  ctx.lineCap = "round";
  ctx.stroke();
}

function sapCiz(c, t, merkezX, merkezY) {
  const bx = W/2;
  const by = H*0.91;
  const hedefX = W/2 + c.x * Math.min(W,H)*0.83;
  const hedefY = H*0.50 + c.y * Math.min(W,H)*0.83;

  const p = yumusak(t);
  const x = bx + (hedefX-bx)*p;
  const y = by + (hedefY-by)*p;

  ctx.beginPath();
  ctx.moveTo(bx,by);
  ctx.quadraticCurveTo(
    bx + (x-bx)*0.35 + Math.sin(t*3)*8,
    by - (by-y)*0.55,
    x,y
  );
  ctx.strokeStyle = "#277b43";
  ctx.lineWidth = Math.max(2,Math.min(W,H)*0.009);
  ctx.lineCap = "round";
  ctx.stroke();

  return {x,y};
}

function yaprak(x,y,aci,olcek) {
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(aci);
  ctx.scale(olcek,olcek);

  const g = ctx.createLinearGradient(0,-18,0,18);
  g.addColorStop(0,"#65bb69");
  g.addColorStop(0.5,"#238346");
  g.addColorStop(1,"#104c30");

  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.quadraticCurveTo(20,-25,48,-10);
  ctx.quadraticCurveTo(30,15,0,0);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.quadraticCurveTo(24,-5,44,-10);
  ctx.strokeStyle = "rgba(220,255,200,.45)";
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();
}

function cicekCiz(c, x, y, acilis, zaman) {
  const r = c.r * Math.min(W,H);
  const ac = yumusak(acilis);
  if(ac <= 0) return;

  ctx.save();
  ctx.translate(x,y);

  const salinim = Math.sin(zaman*1.2+c.x*5)*0.025;
  ctx.rotate(salinim);

  for(let i=0;i<c.n;i++) {
    const a = i*Math.PI*2/c.n;
    const uzunluk = r*0.88*ac;
    const en = r*0.27*ac;

    ctx.save();
    ctx.rotate(a);
    ctx.translate(0,-uzunluk*0.48);

    const gr = ctx.createLinearGradient(0,-uzunluk/2,0,uzunluk/2);
    gr.addColorStop(0,"#ffffff");
    gr.addColorStop(0.22,c.renk);
    gr.addColorStop(1,c.renk);

    ctx.fillStyle = gr;
    ctx.shadowColor = c.renk;
    ctx.shadowBlur = 9;

    ctx.beginPath();
    ctx.ellipse(0,0,en,uzunluk/2,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  ctx.shadowBlur = 0;

  const merkezR = r*0.23*ac;
  const merkezGr = ctx.createRadialGradient(
    -merkezR/3,-merkezR/3,1,0,0,merkezR
  );
  merkezGr.addColorStop(0,"#fffbd4");
  merkezGr.addColorStop(0.5,c.merkez);
  merkezGr.addColorStop(1,"#b86b32");

  ctx.fillStyle = merkezGr;
  ctx.beginPath();
  ctx.arc(0,0,merkezR,0,Math.PI*2);
  ctx.fill();

  for(let i=0;i<18;i++) {
    const a = i*2.4;
    const d = merkezR*0.7;
    ctx.fillStyle = "#fff5bd";
    ctx.beginPath();
    ctx.arc(Math.cos(a)*d,Math.sin(a)*d,1.2,0,Math.PI*2);
    ctx.fill();
  }

  ctx.restore();
}

function isiklariHazirla() {
  parcaciklar = [];
  for(let i=0;i<90;i++) {
    parcaciklar.push({
      x:Math.random()*W,
      y:Math.random()*H,
      boy:rastgele(1,3),
      hiz:rastgele(8,30),
      faz:Math.random()*10
    });
  }
}

function isiklariCiz(zaman,dt) {
  ctx.save();
  ctx.globalCompositeOperation = "lighter";

  parcaciklar.forEach(p=>{
    p.y -= p.hiz*dt;
    p.x += Math.sin(zaman+p.faz)*8*dt;

    if(p.y < -10) {
      p.y = H+10;
      p.x = Math.random()*W;
    }

    const parlaklik = 0.3+0.7*Math.abs(Math.sin(zaman*2+p.faz));

    ctx.globalAlpha = parlaklik;
    ctx.fillStyle = "#ffe6b8";
    ctx.shadowColor = "#ffb9ef";
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.boy,0,Math.PI*2);
    ctx.fill();
  });

  ctx.restore();
}

function arkaplan(zaman) {
  const g = ctx.createRadialGradient(
    W/2,H*0.5,5,W/2,H*0.5,Math.max(W,H)*0.7
  );
  g.addColorStop(0,"#17102b");
  g.addColorStop(0.55,"#090613");
  g.addColorStop(1,"#020207");

  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);
}

function ciz(zaman,dt) {
  ctx.setTransform(DPR,0,0,DPR,0,0);
  arkaplan(zaman);

  const olcek = Math.min(W,H)*0.83;
  const tabanX = W/2;
  const tabanY = H*0.91;

  cicekler.forEach((c,i)=>{
    const bas = 0.5+i*0.28;
    const p = (zaman-bas)/2.5;
    const hedefX = W/2+c.x*olcek;
    const hedefY = H*0.50+c.y*olcek;
    const nokta = sapCiz(c,p,hedefX,hedefY);

    const yaprakP = yumusak((zaman-1.2-i*0.18)/1.2);
    if(yaprakP>0) {
      yaprak(
        tabanX+(hedefX-tabanX)*0.43,
        tabanY+(hedefY-tabanY)*0.43,
        i%2===0?-0.65:3.7,
        0.65*yaprakP
      );
    }

    cicekCiz(c,nokta.x,nokta.y,(zaman-bas)/2.5,zaman);
  });

  isiklariCiz(zaman,dt);

  if(mesaj.textContent && zaman>6) {
    mesaj.classList.add("goster");
  }
}

function yenidenBaslat() {
  baslangic = performance.now();
  mesaj.classList.remove("goster");
}

function dongu(simdi) {
  const zaman = (simdi-baslangic)/1000;
  const dt = Math.min((simdi-sonZaman)/1000,0.05);
  sonZaman = simdi;
  ciz(zaman,dt);
  requestAnimationFrame(dongu);
}

window.addEventListener("click",yenidenBaslat);
window.addEventListener("keydown",e=>{
  if(e.code==="Space") yenidenBaslat();
});

boyutla();
isiklariHazirla();
yenidenBaslat();
sonZaman = performance.now();
requestAnimationFrame(dongu);
</script>
</body>
</html>
